<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas AW | Catálogo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ENCABEZADO: logotipo y menú. Se repite igual en todas las páginas -->
  <header>
    <a href="index.html" class="logotipo"><strong>Subastas AW</strong></a>
    <nav>
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <!-- js/sesion.js muestra u oculta estas opciones según el usuario (atributo hidden) -->
        <li id="opcion-publicar" hidden><a href="publicar.html">Publicar</a></li>
        <li id="opcion-iniciar-sesion"><a href="iniciar-sesion.html">Iniciar sesión</a></li>
        <li id="opcion-registrarse"><a href="registro.html">Registrarse</a></li>
        <li id="opcion-saludo" hidden><span id="saludo-al-usuario"></span></li>
        <li id="opcion-cerrar-sesion" hidden>
          <button type="button" id="boton-cerrar-sesion" class="boton-con-aspecto-de-enlace">Cerrar sesión</button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Subastas activas</h1>

    <!-- BÚSQUEDA Y FILTRO (en la Sección 9 les daremos funcionalidad con JavaScript) -->
    <form id="formulario-de-busqueda" role="search">
      <label for="texto-a-buscar">Buscar producto</label>
      <input type="search" id="texto-a-buscar" name="texto_a_buscar" placeholder="Ej. bicicleta, celular...">

      <label for="filtro-de-categoria">Categoría</label>
      <select id="filtro-de-categoria" name="categoria">
        <option value="">Todas</option>
        <option value="electronica">Electrónica</option>
        <option value="hogar">Hogar</option>
        <option value="ropa">Ropa</option>
        <option value="deportes">Deportes</option>
        <option value="otros">Otros</option>
      </select>

      <button type="submit">Buscar</button>
    </form>

    <!-- Mensajes para el usuario: "Cargando...", "No hay subastas", errores -->
    <p id="mensaje-del-catalogo" role="status"></p>

    <!-- LISTA DE SUBASTAS: js/catalogo.js crea aquí una tarjeta por cada subasta
         que viene de la base de datos -->
    <section id="lista-de-subastas" aria-label="Lista de subastas"></section>
  </main>

  <footer>
    <p>Subastas AW · Proyecto final de Aplicaciones Web · UABC FIAD 2026</p>
  </footer>

  <!-- SCRIPTS. El orden importa:
       1) la librería de Supabase (desde un CDN, con versión fija)
       2) nuestra conexión (usa la librería)
       3) utilidades y 4) la sesión (usan la conexión)
       5) la lógica de esta página -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/conexion-a-supabase.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/catalogo.js"></script>

</body>
</html>
