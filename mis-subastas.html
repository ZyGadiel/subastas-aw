<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas AW | Mis subastas</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- El tema (claro u oscuro) se decide aquí, ANTES de dibujar la página,
       para que no se vea blanca un instante y luego oscura -->
  <script src="js/tema.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logotipo"><strong>Subastas AW</strong></a>
    <nav>
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <!-- js/sesion.js muestra u oculta estas opciones según el usuario (atributo hidden) -->
        <li id="opcion-publicar" hidden><a href="publicar.html">Publicar</a></li>
        <li id="opcion-mis-subastas" hidden><a href="mis-subastas.html">Mis subastas</a></li>
        <li id="opcion-administrar" hidden><a href="administrador.html">Administrar</a></li>
        <li id="opcion-iniciar-sesion"><a href="iniciar-sesion.html">Iniciar sesión</a></li>
        <li id="opcion-registrarse"><a href="registro.html">Registrarse</a></li>
        <li id="opcion-saludo" hidden><span id="saludo-al-usuario"></span></li>
        <li id="opcion-cerrar-sesion" hidden>
          <button type="button" id="boton-cerrar-sesion" class="boton-con-aspecto-de-enlace">Cerrar sesión</button>
        </li>
        <!-- js/tema.js le pone el ícono (🌙 o ☀️) y su función -->
        <li>
          <button type="button" id="boton-de-modo-oscuro" class="boton-con-aspecto-de-enlace" aria-label="Cambiar de tema">🌙</button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- js/mis-subastas.js cambia el título según el rol:
         vendedor → "Mis publicaciones"   comprador → "Subastas en las que participo" -->
    <h1 id="titulo-de-mis-subastas">Mis subastas</h1>

    <!-- Resumen en una línea: "Publicaste 4 subastas · 2 vendidas · Recibes en total $3,200.00" -->
    <p id="resumen-de-mis-subastas"></p>

    <!-- Avisos: "Cargando...", "Inicia sesión...", "Todavía no tienes subastas", errores -->
    <p id="mensaje-de-mis-subastas" role="status" class="mensaje-de-aviso">Cargando tus subastas...</p>

    <!-- Una tarjeta por subasta (mismo diseño que el catálogo) -->
    <section id="lista-de-mis-subastas" aria-label="Mis subastas"></section>
  </main>

  <footer>
    <p>Subastas AW · Proyecto final de Aplicaciones Web · UABC FIAD 2026</p>
  </footer>

  <!-- SCRIPTS. El orden importa:
       1) la librería de Supabase (desde un CDN, con versión fija)
       2) nuestra conexión (usa la librería)
       3) utilidades y 4) la sesión (usan la conexión)
       5) la lógica de esta página -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/conexion-a-supabase.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/mis-subastas.js"></script>

</body>
</html>
