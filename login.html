<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas AW | Iniciar sesión</title>
</head>
<body>

  <header>
    <a href="index.html"><strong>Subastas AW</strong></a>
    <nav>
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <li><a href="publicar.html">Publicar</a></li>
        <li><a href="login.html">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Iniciar sesión</h1>

    <form id="form-login">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" autocomplete="email" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>

      <button type="submit">Entrar</button>
    </form>

    <!-- Aquí mostraremos errores como "correo o contraseña incorrectos" (Sección 4) -->
    <p id="mensaje-login" role="alert"></p>

    <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </main>

  <footer>
    <p>Subastas AW · Proyecto final de Aplicaciones Web · UABC FIAD 2026</p>
  </footer>

</body>
</html>
