<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas AW | Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
  <!-- Ícono de la pestaña: un martillo de subasta dibujado con un emoji dentro de un SVG.
       Va escrito aquí mismo (data:), así no hace falta un archivo de imagen. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔨</text></svg>">
  <!-- El tema (claro u oscuro) se decide aquí, ANTES de dibujar la página,
       para que no se vea blanca un instante y luego oscura -->
  <script src="js/tema.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logotipo"><strong>Subastas AW</strong></a>
    <nav>
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <!-- js/sesion.js muestra u oculta estas opciones según el usuario (atributo hidden) -->
        <li id="opcion-publicar" hidden><a href="publicar.html">Publicar</a></li>
        <li id="opcion-mis-subastas" hidden><a href="mis-subastas.html">Mis subastas</a></li>
        <li id="opcion-administrar" hidden><a href="administrador.html">Administrar</a></li>
        <li id="opcion-iniciar-sesion"><a href="iniciar-sesion.html">Iniciar sesión</a></li>
        <li id="opcion-registrarse"><a href="registro.html">Registrarse</a></li>
        <li id="opcion-saludo" hidden><span id="saludo-al-usuario"></span></li>
        <li id="opcion-cerrar-sesion" hidden>
          <button type="button" id="boton-cerrar-sesion" class="boton-con-aspecto-de-enlace">Cerrar sesión</button>
        </li>
        <!-- js/tema.js le pone el ícono (🌙 o ☀️) y su función -->
        <li>
          <button type="button" id="boton-de-modo-oscuro" class="boton-con-aspecto-de-enlace" aria-label="Cambiar de tema">🌙</button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Iniciar sesión</h1>

    <form id="formulario-de-inicio-de-sesion">
      <label for="correo">Correo electrónico</label>
      <!-- type="email" acepta "ejemplo@ejemplo" (sin punto). El atributo pattern exige
           además un dominio con punto: ejemplo@ejemplo.com. El "title" se muestra en el aviso
           del navegador. La misma regla está en js/utilidades.js (esCorreoValido). -->
      <input type="email" id="correo" name="correo" autocomplete="email" required
             pattern="[^@\s]+@[^@\s.]+(\.[^@\s.]+)*\.[A-Za-z]{2,}"
             title="Escribe un correo completo, por ejemplo: ejemplo@correo.com"
             placeholder="ejemplo@correo.com">

      <label for="contrasena">Contraseña</label>
      <!-- El campo y el botón "Mostrar" van juntos en una fila (css: .contrasena-con-boton).
           type="button" = el botón NO envía el formulario; js/utilidades.js le da su función. -->
      <div class="contrasena-con-boton">
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
        <button type="button" id="boton-ver-contrasena" class="boton-de-ver-contrasena"
                aria-controls="contrasena" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <!-- Aquí mostraremos errores como "correo o contraseña incorrectos" (Sección 5) -->
    <p id="mensaje-de-inicio-de-sesion" role="alert"></p>

    <!-- id: js/iniciar-sesion.js le agrega el ?volver= para no perder a dónde regresar -->
    <p>¿No tienes cuenta? <a id="enlace-al-registro" href="registro.html">Regístrate</a></p>
  </main>

  <footer>
    <p>Subastas AW · Proyecto final de Aplicaciones Web · UABC FIAD 2026</p>
  </footer>

  <!-- SCRIPTS. El orden importa:
       1) la librería de Supabase (desde un CDN, con versión fija)
       2) nuestra conexión (usa la librería)
       3) utilidades y 4) la sesión (usan la conexión)
       5) la lógica de esta página -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/conexion-a-supabase.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/iniciar-sesion.js"></script>

</body>
</html>
