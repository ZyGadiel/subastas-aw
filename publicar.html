<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subastas AW | Publicar producto</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <a href="index.html" class="logotipo"><strong>Subastas AW</strong></a>
    <nav>
      <ul>
        <li><a href="index.html">Catálogo</a></li>
        <!-- js/sesion.js muestra u oculta estas opciones según el usuario (atributo hidden) -->
        <li id="opcion-publicar" hidden><a href="publicar.html">Publicar</a></li>
        <li id="opcion-iniciar-sesion"><a href="iniciar-sesion.html">Iniciar sesión</a></li>
        <li id="opcion-registrarse"><a href="registro.html">Registrarse</a></li>
        <li id="opcion-saludo" hidden><span id="saludo-al-usuario"></span></li>
        <li id="opcion-cerrar-sesion" hidden>
          <button type="button" id="boton-cerrar-sesion" class="boton-con-aspecto-de-enlace">Cerrar sesión</button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Publicar un producto</h1>

    <!-- FORMULARIO DEL VENDEDOR. Los atributos required, min y maxlength
         son la primera barrera contra casos límite (campos vacíos, negativos, textos enormes).
         En la Sección 6 agregaremos validación con JavaScript.
         Cada "name" es igual al nombre de su columna en la tabla "subastas". -->
    <form id="formulario-de-publicacion">

      <fieldset>
        <legend>Información del producto</legend>

        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" maxlength="80" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="4" maxlength="500" required></textarea>

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="electronica">Electrónica</option>
          <option value="hogar">Hogar</option>
          <option value="ropa">Ropa</option>
          <option value="deportes">Deportes</option>
          <option value="otros">Otros</option>
        </select>

        <label for="url-de-la-foto">Dirección (URL) de la foto</label>
        <input type="url" id="url-de-la-foto" name="url_de_la_foto" placeholder="https://...">
      </fieldset>

      <fieldset>
        <legend>Reglas de la subasta</legend>

        <label for="precio-inicial">Precio inicial ($)</label>
        <input type="number" id="precio-inicial" name="precio_inicial" min="1" step="0.01" required>

        <label for="incremento-minimo">Incremento mínimo por puja ($)</label>
        <input type="number" id="incremento-minimo" name="incremento_minimo" min="1" step="0.01" required>

        <label for="duracion-en-minutos">Duración</label>
        <select id="duracion-en-minutos" name="duracion_en_minutos" required>
          <option value="2">2 minutos (para probar)</option>
          <option value="5">5 minutos</option>
          <option value="60">1 hora</option>
          <option value="1440">1 día</option>
        </select>
      </fieldset>

      <p>Nota: la página cobra una comisión del 3 % sobre el precio final de venta.</p>

      <button type="submit">Publicar subasta</button>
    </form>
  </main>

  <footer>
    <p>Subastas AW · Proyecto final de Aplicaciones Web · UABC FIAD 2026</p>
  </footer>

  <!-- SCRIPTS. El orden importa:
       1) la librería de Supabase (desde un CDN, con versión fija)
       2) nuestra conexión (usa la librería)
       3) utilidades y 4) la sesión (usan la conexión)
       5) la lógica de esta página -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/conexion-a-supabase.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/sesion.js"></script>
</body>
</html>
